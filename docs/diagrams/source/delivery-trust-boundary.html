<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub delivery trust boundary (MVP)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      color: #2d3142;
      font-family: 'Geist', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Trust boundary</p>
    <h1>GitHub delivery trust boundary (MVP)</h1>

    <svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="delivery-trust-boundary-title delivery-trust-boundary-desc" id="delivery-trust-boundary-root">
      <title id="delivery-trust-boundary-title">GitHub delivery trust boundary (MVP)</title>
      <desc id="delivery-trust-boundary-desc">The temporary MVP credential boundary: the tracker reads GITHUB_TOKEN on the host, the agent subprocess never inherits it but is not otherwise sandboxed, the delivery skill reaches GitHub through host-provided git and gh for push, PR and check reads, and the opt-in auto-merge gate governs only the squash-merge decision.</desc>

      <defs>
        <style>
          #delivery-trust-boundary-root .name { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #2d3142; }
          #delivery-trust-boundary-root .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
          #delivery-trust-boundary-root .zone-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; fill: rgba(45,49,66,0.40); }
          #delivery-trust-boundary-root .arrow-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
          #delivery-trust-boundary-root .foot { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8.5px; fill: #4f5d75; }
          #delivery-trust-boundary-root .foot-accent { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8.5px; fill: #eb6c36; }
        </style>
        <marker id="tb-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="tb-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="tb-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Trust boundary zones (dashed) -->
      <rect x="40" y="64" width="600" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="216" y="68" width="248" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="77" text-anchor="middle">HOST · SYMPHONY PROCESS</text>

      <rect x="40" y="344" width="600" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="300" y="348" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="357" text-anchor="middle">WORKSPACE</text>

      <rect x="88" y="464" width="504" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="278" y="468" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="477" text-anchor="middle">AGENT SUBPROCESS</text>

      <!-- Arrows -->
      <line x1="244" y1="132" x2="260" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>

      <path d="M 800,120 V 98 Q 800,90 792,90 H 348 Q 340,90 340,98 V 104" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <rect x="470" y="84" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="474" y="93">issue facts</text>

      <path d="M 390,196 V 190 Q 390,182 398,182 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <rect x="420" y="176" width="172" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="424" y="185">push · open/reuse PR · read checks</text>

      <line x1="800" y1="260" x2="800" y2="216" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#tb-arrow-accent)"/>
      <rect x="808" y="228" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="812" y="237">squash merge</text>

      <path d="M 568,516 H 616 Q 624,516 624,508 V 300 Q 624,292 616,292 H 398 Q 390,292 390,284 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <rect x="436" y="286" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="440" y="295">delivery skill uses host git/gh</text>

      <path d="M 568,536 H 648 Q 656,536 656,528 V 300 Q 656,292 664,292 H 680" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tb-arrow-soft)"/>
      <rect x="664" y="394" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="668" y="403">land policy (delivery skill)</text>

      <!-- HOST nodes -->
      <rect x="64" y="104" width="180" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text class="name" x="154" y="130" text-anchor="middle">Host env</text>
      <text class="sub" x="154" y="146" text-anchor="middle">GITHUB_TOKEN</text>

      <rect x="260" y="104" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="350" y="130" text-anchor="middle">Tracker Adapter</text>
      <text class="sub" x="350" y="146" text-anchor="middle">reads token on the host</text>

      <rect x="64" y="196" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="184" y="222" text-anchor="middle">Effective Runtime</text>
      <text class="sub" x="184" y="240" text-anchor="middle">policy · excludeEnvNames</text>

      <rect x="320" y="196" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="390" y="222" text-anchor="middle">host git / gh</text>
      <text class="sub" x="390" y="240" text-anchor="middle">host credentials</text>

      <!-- WORKSPACE nodes -->
      <rect x="64" y="384" width="552" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="340" y="410" text-anchor="middle">Workspace</text>
      <text class="sub" x="340" y="426" text-anchor="middle">cloned repo · deterministic branch · host-owned</text>

      <rect x="112" y="496" width="456" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="340" y="522" text-anchor="middle">Codex app-server</text>
      <text class="sub" x="340" y="538" text-anchor="middle">coding agent subprocess · cwd = workspace</text>
      <text class="sub" x="340" y="566" text-anchor="middle">child env excludes GITHUB_TOKEN (excludeEnvNames)</text>

      <!-- GITHUB node (external) -->
      <rect x="680" y="120" width="240" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="800" y="156" text-anchor="middle">GitHub</text>
      <text class="sub" x="800" y="176" text-anchor="middle">REST API · git remote</text>
      <text class="sub" x="800" y="194" text-anchor="middle">durable facts · issues · PRs · CI</text>

      <!-- AUTO-MERGE GATE node (focal) -->
      <rect x="680" y="260" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="name" x="800" y="286" text-anchor="middle">Auto-merge gate</text>
      <text class="sub" x="800" y="302" text-anchor="middle">opt-in · PR ownership</text>
      <text class="sub" x="800" y="316" text-anchor="middle">required + observed green</text>

      <!-- Footer notes -->
      <line x1="40" y1="608" x2="920" y2="608" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="foot-accent" x="40" y="630">MVP trust boundary — temporary and non-final; a provider-native tools boundary may replace it.</text>
      <text class="foot" x="40" y="648">The tracker reads GITHUB_TOKEN on the host; the agent subprocess never inherits it.</text>
      <text class="foot" x="40" y="666">Excluding the token is not a sandbox — the delivery skill still uses host git/gh credentials.</text>
      <text class="foot" x="40" y="684">The auto-merge gate governs only the delivery skill's squash-merge decision; push, PR creation/reuse and check reads are not gated.</text>
      <text class="foot" x="40" y="702">Auto-merge is opt-in and requires PR ownership plus required / observed checks green; pending, failing, zero or unknown checks fail closed.</text>
    </svg>
  </div>
</body>
</html>
