<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub delivery trust boundary (MVP)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      color: #2d3142;
      font-family: 'Geist', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Trust boundary</p>
    <h1>GitHub delivery trust boundary (MVP)</h1>

    <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="delivery-trust-boundary-title delivery-trust-boundary-desc" id="delivery-trust-boundary-root">
      <title id="delivery-trust-boundary-title">GitHub delivery trust boundary (MVP)</title>
      <desc id="delivery-trust-boundary-desc">The temporary MVP credential boundary: the tracker reads GITHUB_TOKEN on the host, the agent subprocess never inherits it, and the delivery skill reaches GitHub through host-provided git and gh credentials behind an opt-in auto-merge gate.</desc>

      <defs>
        <style>
          #delivery-trust-boundary-root .name { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #2d3142; }
          #delivery-trust-boundary-root .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
          #delivery-trust-boundary-root .zone-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; fill: rgba(45,49,66,0.40); }
          #delivery-trust-boundary-root .arrow-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
          #delivery-trust-boundary-root .foot { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8.5px; fill: #4f5d75; }
          #delivery-trust-boundary-root .foot-accent { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8.5px; fill: #eb6c36; }
        </style>
        <marker id="tb-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Trust boundary zones (dashed) -->
      <rect x="40" y="64" width="600" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="216" y="68" width="248" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="77" text-anchor="middle">HOST · SYMPHONY PROCESS</text>

      <rect x="40" y="344" width="600" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="300" y="348" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="357" text-anchor="middle">WORKSPACE</text>

      <rect x="88" y="464" width="504" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="278" y="468" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="477" text-anchor="middle">AGENT SUBPROCESS</text>

      <!-- Arrows -->
      <line x1="244" y1="132" x2="260" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>

      <path d="M 680,196 H 660 Q 652,196 652,188 V 140 Q 652,132 644,132 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <text class="arrow-label" x="556" y="124" text-anchor="middle">issue / PR / CI facts</text>

      <path d="M 568,524 H 616 Q 624,524 624,516 V 300 Q 624,292 616,292 H 398 Q 390,292 390,284 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <rect x="436" y="286" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="440" y="295">delivery skill uses host git/gh</text>

      <line x1="460" y1="228" x2="476" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>

      <line x1="624" y1="228" x2="680" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>

      <!-- HOST nodes -->
      <rect x="64" y="104" width="180" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text class="name" x="154" y="130" text-anchor="middle">Host env</text>
      <text class="sub" x="154" y="146" text-anchor="middle">GITHUB_TOKEN</text>

      <rect x="260" y="104" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="350" y="130" text-anchor="middle">Tracker Adapter</text>
      <text class="sub" x="350" y="146" text-anchor="middle">reads token on the host</text>

      <rect x="64" y="196" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="184" y="222" text-anchor="middle">Effective Runtime</text>
      <text class="sub" x="184" y="240" text-anchor="middle">policy · excludeEnvNames</text>

      <rect x="320" y="196" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="390" y="222" text-anchor="middle">host git / gh</text>
      <text class="sub" x="390" y="240" text-anchor="middle">host credentials</text>

      <rect x="476" y="196" width="148" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="name" x="550" y="220" text-anchor="middle">Auto-merge gate</text>
      <text class="sub" x="550" y="236" text-anchor="middle">opt-in · ownership</text>
      <text class="sub" x="550" y="250" text-anchor="middle">check policy</text>

      <!-- WORKSPACE nodes -->
      <rect x="64" y="384" width="552" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="340" y="410" text-anchor="middle">Workspace</text>
      <text class="sub" x="340" y="426" text-anchor="middle">cloned repo · deterministic branch · host-owned</text>

      <rect x="112" y="496" width="456" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="340" y="522" text-anchor="middle">Codex app-server</text>
      <text class="sub" x="340" y="538" text-anchor="middle">coding agent subprocess · cwd = workspace</text>
      <text class="sub" x="340" y="566" text-anchor="middle">child env excludes GITHUB_TOKEN (excludeEnvNames)</text>

      <!-- GITHUB node (external) -->
      <rect x="680" y="180" width="240" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="800" y="212" text-anchor="middle">GitHub</text>
      <text class="sub" x="800" y="230" text-anchor="middle">REST API · git remote</text>
      <text class="sub" x="800" y="248" text-anchor="middle">durable issue / PR / CI facts</text>

      <!-- Footer notes -->
      <line x1="40" y1="616" x2="920" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="foot-accent" x="40" y="640">MVP trust boundary — temporary and non-final; a provider-native tools boundary may replace it.</text>
      <text class="foot" x="40" y="658">The tracker reads GITHUB_TOKEN on the host; the agent subprocess never inherits it. git push and gh use host-provided credentials, not a token in the workspace.</text>
      <text class="foot" x="40" y="676">Auto-merge is opt-in and gated by PR ownership plus required / observed check policy; pending, failing, zero or unknown checks fail closed.</text>
    </svg>
  </div>
</body>
</html>
