<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symphony GitHub delivery loop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      color: #2d3142;
      font-family: 'Geist', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1160px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1120px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process</p>
    <h1>The GitHub delivery loop</h1>

    <svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="github-delivery-loop-title github-delivery-loop-desc" id="github-delivery-loop-root">
      <title id="github-delivery-loop-title">The GitHub delivery loop</title>
      <desc id="github-delivery-loop-desc">The automatic delivery path from a ready GitHub issue to a merged pull request and a closed issue, with a bounded CI repair loop and a handoff exit when delivery cannot complete safely.</desc>

      <defs>
        <style>
          #github-delivery-loop-root .name { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #2d3142; }
          #github-delivery-loop-root .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
          #github-delivery-loop-root .owner { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 7px; font-weight: 500; letter-spacing: 0.08em; fill: #4f5d75; }
          #github-delivery-loop-root .arrow-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
          #github-delivery-loop-root .foot { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8.5px; fill: #4f5d75; }
        </style>
        <marker id="dl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="dl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Owner legend (top) -->
      <text class="owner" x="40" y="80">OWNER</text>
      <text class="foot" x="88" y="80">GH GitHub · SYM Symphony · CDX Codex / delivery skill · CI verifier</text>

      <!-- Loop-back return edge -->
      <path d="M 1048,200 V 116 Q 1048,112 1044,112 H 80 Q 76,112 76,116 V 200" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dl-arrow)"/>
      <text class="arrow-label" x="562" y="106" text-anchor="middle">Symphony keeps polling for the next ready issue</text>

      <!-- Main rail edges -->
      <line x1="160" y1="232" x2="172" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <line x1="292" y1="232" x2="304" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <line x1="424" y1="232" x2="436" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <line x1="556" y1="232" x2="568" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <line x1="688" y1="232" x2="700" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <line x1="820" y1="232" x2="832" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <line x1="952" y1="232" x2="964" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>

      <!-- CI failure path -->
      <line x1="760" y1="264" x2="760" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <rect x="768" y="296" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="772" y="305">failed</text>

      <path d="M 680,372 H 644 Q 636,372 636,364 V 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
      <rect x="556" y="310" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="560" y="319">re-validate + push</text>

      <!-- Handoff exit -->
      <line x1="760" y1="400" x2="760" y2="456" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dl-arrow)"/>
      <rect x="768" y="420" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="772" y="429">budget exhausted</text>

      <!-- Owner chips -->
      <rect x="90" y="172" width="20" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="100" y="181" text-anchor="middle">GH</text>
      <rect x="218" y="172" width="28" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="232" y="181" text-anchor="middle">SYM</text>
      <rect x="350" y="172" width="28" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="364" y="181" text-anchor="middle">SYM</text>
      <rect x="482" y="172" width="28" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="496" y="181" text-anchor="middle">CDX</text>
      <rect x="614" y="172" width="28" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="628" y="181" text-anchor="middle">CDX</text>
      <rect x="750" y="172" width="20" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="760" y="181" text-anchor="middle">CI</text>
      <rect x="870" y="172" width="44" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="892" y="181" text-anchor="middle">CDX/GH</text>
      <rect x="1010" y="172" width="28" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="owner" x="1024" y="181" text-anchor="middle">SYM</text>

      <!-- Rail nodes -->
      <rect x="40" y="200" width="120" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="100" y="228" text-anchor="middle">Ready issue</text>
      <text class="sub" x="100" y="244" text-anchor="middle">open + label</text>

      <rect x="172" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="232" y="228" text-anchor="middle">Dispatch</text>
      <text class="sub" x="232" y="244" text-anchor="middle">poll · claim</text>

      <rect x="304" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="364" y="228" text-anchor="middle">Bootstrap</text>
      <text class="sub" x="364" y="244" text-anchor="middle">clone + branch</text>

      <rect x="436" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="496" y="228" text-anchor="middle">Implement</text>
      <text class="sub" x="496" y="244" text-anchor="middle">Codex + validate</text>

      <rect x="568" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="628" y="228" text-anchor="middle">Push + PR</text>
      <text class="sub" x="628" y="244" text-anchor="middle">commit · reuse</text>

      <rect x="700" y="200" width="120" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="name" x="760" y="228" text-anchor="middle">CI inspect</text>
      <text class="sub" x="760" y="244" text-anchor="middle">required checks</text>

      <rect x="832" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="892" y="228" text-anchor="middle">Merge + close</text>
      <text class="sub" x="892" y="244" text-anchor="middle">squash · Fixes #N</text>

      <rect x="964" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="1024" y="228" text-anchor="middle">Reconcile</text>
      <text class="sub" x="1024" y="244" text-anchor="middle">cleanup + poll</text>

      <!-- Repair node -->
      <rect x="680" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="760" y="370" text-anchor="middle">Repair (bounded)</text>
      <text class="sub" x="760" y="386" text-anchor="middle">diagnostics → repair cmd</text>

      <!-- Handoff node -->
      <rect x="680" y="456" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,4"/>
      <text class="name" x="760" y="482" text-anchor="middle">Handoff</text>
      <text class="sub" x="760" y="498" text-anchor="middle">issue stays open</text>

      <!-- Footer notes -->
      <line x1="40" y1="540" x2="1080" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="foot" x="40" y="560">GitHub holds the durable facts · Symphony schedules, supervises and reconciles · Codex / delivery skill executes · CI verifies.</text>
      <text class="foot" x="40" y="578">Failed checks enter the bounded repair loop; pending checks wait within the CI deadline and never trigger repair; zero or unknown checks fail closed.</text>
    </svg>
  </div>
</body>
</html>
