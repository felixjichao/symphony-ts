<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 740" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="package-dependencies-zh-title package-dependencies-zh-desc" id="package-dependencies-zh-root">
      <title id="package-dependencies-zh-title">Symphony 包依赖</title>
      <desc id="package-dependencies-zh-desc">八个 npm workspace 的分层依赖图。箭头由依赖方指向被依赖方，全部包最终汇聚到 @symphony/domain，apps/cli 位于顶端作为宿主入口。</desc>

      <defs>
        <style>
          #package-dependencies-zh-root .name { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 600; font-size: 13px; fill: #2d3142; }
          #package-dependencies-zh-root .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
          #package-dependencies-zh-root .sub-zh { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 12px; fill: #4f5d75; }
          #package-dependencies-zh-root .badge { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #4f5d75; }
          #package-dependencies-zh-root .note-key { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 10px; fill: #4f5d75; }
          #package-dependencies-zh-root .note { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #4f5d75; }
        </style>
        <marker id="pd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn before nodes) -->
      <line x1="480" y1="104" x2="480" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <path d="M 564,76 H 862 Q 870,76 870,84 V 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <line x1="480" y1="216" x2="480" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <path d="M 564,200 H 584 Q 592,200 592,208 V 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <path d="M 396,284 H 168 Q 160,284 160,292 V 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <line x1="440" y1="328" x2="440" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <path d="M 160,440 V 464 Q 160,472 168,472 H 432 Q 440,472 440,480 V 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <path d="M 376,440 V 476 Q 376,484 384,484 H 472 Q 480,484 480,492 V 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <path d="M 592,440 V 468 Q 592,476 584,476 H 528 Q 520,476 520,484 V 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <path d="M 808,440 V 516 Q 808,524 800,524 H 572" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pd-arrow)"/>

      <!-- Node: apps/cli -->
      <rect x="396" y="48" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="524" y="56" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="540" y="65" text-anchor="middle">0 in</text>
      <text class="name" x="480" y="74" text-anchor="middle">apps/cli</text>
      <text class="sub-zh" x="480" y="92" text-anchor="middle">宿主入口 · SPEC §17/§18</text>

      <!-- Node: orchestrator -->
      <rect x="396" y="160" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="524" y="168" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="540" y="177" text-anchor="middle">1 in</text>
      <text class="name" x="480" y="186" text-anchor="middle">orchestrator</text>
      <text class="sub-zh" x="480" y="204" text-anchor="middle">调度 · 重试 · 状态</text>

      <!-- Node: agent -->
      <rect x="396" y="272" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="524" y="280" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="540" y="289" text-anchor="middle">1 in</text>
      <text class="name" x="480" y="298" text-anchor="middle">agent</text>
      <text class="sub" x="480" y="314" text-anchor="middle">runner · Codex session</text>

      <!-- Rank 1 nodes -->
      <rect x="76" y="384" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="204" y="392" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="220" y="401" text-anchor="middle">1 in</text>
      <text class="name" x="160" y="410" text-anchor="middle">config</text>
      <text class="sub" x="160" y="426" text-anchor="middle">WORKFLOW · typed config</text>

      <rect x="292" y="384" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="420" y="392" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="436" y="401" text-anchor="middle">1 in</text>
      <text class="name" x="376" y="410" text-anchor="middle">workspace</text>
      <text class="sub-zh" x="376" y="428" text-anchor="middle">目录 · hooks · 安全</text>

      <rect x="508" y="384" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="636" y="392" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="652" y="401" text-anchor="middle">1 in</text>
      <text class="name" x="592" y="410" text-anchor="middle">tracker</text>
      <text class="sub-zh" x="592" y="428" text-anchor="middle">provider 适配器</text>

      <rect x="724" y="384" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="852" y="392" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="868" y="401" text-anchor="middle">1 in</text>
      <text class="name" x="808" y="410" text-anchor="middle">observability</text>
      <text class="sub-zh" x="808" y="428" text-anchor="middle">日志 · 快照</text>

      <!-- Node: domain (shared base, leaf) -->
      <rect x="396" y="496" width="168" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="524" y="504" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text class="badge" x="540" y="513" text-anchor="middle">4 in</text>
      <text class="name" x="480" y="522" text-anchor="middle">domain</text>
      <text class="sub-zh" x="480" y="540" text-anchor="middle">共享契约 · 无依赖</text>

      <!-- Notes -->
      <line x1="40" y1="580" x2="920" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="note-key" x="40" y="602">说明</text>
      <text class="note" x="40" y="624">箭头由依赖方指向被依赖方。</text>
      <text class="note" x="40" y="644">仅画 covering relations（覆盖关系）；可传递推出的边（如 apps/cli → config）为控制密度而省略。</text>
      <text class="note" x="40" y="664">devDependency 测试专用边省略：tracker → config、workspace → config、orchestrator → observability。</text>
      <text class="note" x="40" y="684">硬约束：tracker 永不依赖 orchestrator；agent 不拥有 scheduler / retry policy。</text>
      <text class="note" x="40" y="704">observability 只消费只读运行时快照契约，不回写到调度权威。</text>
    </svg>
