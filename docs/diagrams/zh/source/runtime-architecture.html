<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symphony 运行时架构</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      color: #2d3142;
      font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture</p>
    <h1>Symphony 运行时架构</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="runtime-architecture-zh-title runtime-architecture-zh-desc" id="runtime-architecture-zh-root">
      <title id="runtime-architecture-zh-title">Symphony 运行时架构</title>
      <desc id="runtime-architecture-zh-desc">Orchestrator 是运行时中心：它从 WORKFLOW.md 加载 typed config，从 GitHub 支撑的 tracker adapter 拉取归一化 issue，provision workspace，运行 Codex app-server attempt，并投影只读的可观测性快照。</desc>

      <defs>
        <style>
          #runtime-architecture-zh-root .name { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 600; font-size: 13px; fill: #2d3142; }
          #runtime-architecture-zh-root .sub { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 12px; fill: #4f5d75; }
          #runtime-architecture-zh-root .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
          #runtime-architecture-zh-root .zone-label { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 10px; fill: rgba(45,49,66,0.45); }
          #runtime-architecture-zh-root .label { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 11px; fill: #4f5d75; }
          #runtime-architecture-zh-root .label-mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
          #runtime-architecture-zh-root .legend { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #4f5d75; }
          #runtime-architecture-zh-root .legend-key { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 10px; fill: #4f5d75; }
        </style>
        <marker id="ra-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="ra-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="ra-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="24" y="200" width="232" height="192" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="100" y="204" width="80" height="13" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="140" y="214" text-anchor="middle">配置输入</text>

      <rect x="304" y="64" width="352" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="452" y="68" width="56" height="13" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="480" y="78" text-anchor="middle">协调</text>

      <rect x="692" y="64" width="228" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="778" y="68" width="56" height="13" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="806" y="78" text-anchor="middle">执行</text>

      <!-- Arrows (drawn before nodes) -->
      <line x1="140" y1="280" x2="140" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="232" y1="332" x2="340" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="232" y1="128" x2="340" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ra-arrow-link)"/>

      <line x1="490" y1="160" x2="490" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <path d="M 640,272 H 664 Q 672,272 672,264 V 136 Q 672,128 680,128 H 708" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <path d="M 640,304 H 680 Q 688,304 688,296 V 240 Q 688,232 696,232 H 708" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="802" y1="160" x2="802" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="802" y1="264" x2="802" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="490" y1="360" x2="490" y2="456" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ra-arrow-accent)"/>

      <path d="M 750,200 V 184 Q 750,176 742,176 H 560 Q 552,176 552,184 V 248" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ra-arrow)"/>

      <!-- Arrow labels -->
      <text class="label-mono" x="286" y="326" text-anchor="middle">typed config</text>

      <rect x="492" y="193" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text class="label" x="496" y="205">归一化 Issue</text>

      <rect x="608" y="191" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text class="label" x="612" y="203">派发</text>

      <rect x="648" y="297" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text class="label-mono" x="667" y="307" text-anchor="middle">attempt</text>

      <rect x="806" y="169" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text class="label" x="810" y="181">工作区</text>

      <rect x="806" y="277" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text class="label-mono" x="810" y="288">session</text>

      <rect x="494" y="397" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text class="label" x="498" y="409" fill="#eb6c36">只读快照</text>

      <rect x="556" y="169" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text class="label" x="560" y="181">session 事件 · outcome</text>

      <!-- Node: GitHub (external) -->
      <rect x="48" y="96" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="140" y="124" text-anchor="middle">GitHub</text>
      <text class="sub" x="140" y="142" text-anchor="middle">issue / PR / CI 事实</text>

      <!-- Node: WORKFLOW.md (input) -->
      <rect x="48" y="232" width="184" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text class="name" x="140" y="254" text-anchor="middle">WORKFLOW.md</text>
      <text class="mono" x="140" y="270" text-anchor="middle">front matter + prompt</text>

      <!-- Node: Config / Workflow Loader -->
      <rect x="48" y="304" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="140" y="329" text-anchor="middle">配置 / Workflow Loader</text>
      <text class="sub" x="140" y="347" text-anchor="middle">解析 · 校验 · 热重载</text>

      <!-- Node: Issue Tracker Adapter -->
      <rect x="340" y="96" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="490" y="124" text-anchor="middle">Issue Tracker 适配器</text>
      <text class="sub" x="490" y="142" text-anchor="middle">provider 无关 · 归一化 payload</text>

      <!-- Node: Orchestrator (focal) -->
      <rect x="340" y="248" width="300" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="name" x="490" y="296" text-anchor="middle">Orchestrator</text>
      <text class="sub" x="490" y="316" text-anchor="middle">调度 · 监督 · 对账</text>
      <text class="sub" x="490" y="334" text-anchor="middle">单一运行时权威</text>

      <!-- Node: Workspace Manager -->
      <rect x="708" y="96" width="188" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="802" y="124" text-anchor="middle">Workspace 管理器</text>
      <text class="sub" x="802" y="142" text-anchor="middle">隔离目录 · hooks</text>

      <!-- Node: Agent Runner -->
      <rect x="708" y="200" width="188" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="802" y="228" text-anchor="middle">Agent Runner</text>
      <text class="sub" x="802" y="246" text-anchor="middle">prompt 组装 · session 事件</text>

      <!-- Node: Codex app-server (external subprocess) -->
      <rect x="708" y="312" width="188" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="802" y="340" text-anchor="middle">Codex app-server</text>
      <text class="sub" x="802" y="358" text-anchor="middle">coding agent 子进程</text>

      <!-- Node: Observability (read-only) -->
      <rect x="340" y="456" width="300" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text class="name" x="490" y="480" text-anchor="middle">可观测性</text>
      <text class="sub" x="490" y="498" text-anchor="middle">结构化日志 · 只读状态快照</text>

      <!-- Legend -->
      <line x1="48" y1="548" x2="912" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="legend-key" x="48" y="563">LEGEND</text>

      <rect x="48" y="576" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text class="legend" x="68" y="585">调度中心</text>

      <rect x="168" y="576" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="legend" x="188" y="585">运行时组件</text>

      <rect x="308" y="576" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="legend" x="328" y="585">外部</text>

      <line x1="392" y1="584" x2="420" y2="584" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ra-arrow-accent)"/>
      <text class="legend" x="428" y="585">只读消费</text>
    </svg>
  </div>
</body>
</html>
