<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="delivery-trust-boundary-zh-title delivery-trust-boundary-zh-desc" id="delivery-trust-boundary-zh-root">
      <title id="delivery-trust-boundary-zh-title">GitHub 交付信任边界（MVP）</title>
      <desc id="delivery-trust-boundary-zh-desc">临时 MVP 凭据边界：tracker 在宿主侧读取 GITHUB_TOKEN，agent 子进程不会继承它但并非完全沙箱；delivery skill 通过宿主 git/gh 完成 push、PR 与 checks 读取，opt-in 自动合入门只作用于 squash-merge 决策。</desc>

      <defs>
        <style>
          #delivery-trust-boundary-zh-root .name { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 600; font-size: 13px; fill: #2d3142; }
          #delivery-trust-boundary-zh-root .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
          #delivery-trust-boundary-zh-root .sub-zh { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 12px; fill: #4f5d75; }
          #delivery-trust-boundary-zh-root .zone-label { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 10px; fill: rgba(45,49,66,0.45); }
          #delivery-trust-boundary-zh-root .label { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; font-size: 11px; fill: #4f5d75; }
          #delivery-trust-boundary-zh-root .label-mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
          #delivery-trust-boundary-zh-root .foot { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #4f5d75; }
          #delivery-trust-boundary-zh-root .foot-accent { font-family: 'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #eb6c36; }
        </style>
        <marker id="tb-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="tb-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="tb-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Trust boundary zones (dashed) -->
      <rect x="40" y="64" width="600" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="232" y="68" width="216" height="14" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="79" text-anchor="middle">HOST · SYMPHONY 进程</text>

      <rect x="40" y="344" width="600" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="300" y="348" width="80" height="14" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="359" text-anchor="middle">WORKSPACE</text>

      <rect x="88" y="464" width="504" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="282" y="468" width="116" height="14" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="340" y="479" text-anchor="middle">AGENT 子进程</text>

      <!-- Arrows -->
      <line x1="244" y1="132" x2="260" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>

      <path d="M 800,120 V 98 Q 800,90 792,90 H 348 Q 340,90 340,98 V 104" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <rect x="468" y="83" width="66" height="15" rx="2" fill="#f5f5f5"/>
      <text class="label" x="472" y="95">issue 事实</text>

      <path d="M 390,196 V 190 Q 390,182 398,182 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <rect x="418" y="175" width="234" height="15" rx="2" fill="#f5f5f5"/>
      <text class="label" x="422" y="187">push · 创建/复用 PR · 读 checks</text>

      <line x1="800" y1="260" x2="800" y2="216" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#tb-arrow-accent)"/>
      <rect x="808" y="227" width="76" height="14" rx="2" fill="#f5f5f5"/>
      <text class="label-mono" x="812" y="237">squash merge</text>

      <path d="M 568,516 H 616 Q 624,516 624,508 V 300 Q 624,292 616,292 H 398 Q 390,292 390,284 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tb-arrow)"/>
      <rect x="430" y="284" width="200" height="15" rx="2" fill="#f5f5f5"/>
      <text class="label" x="434" y="296">delivery skill 使用宿主 git/gh</text>

      <path d="M 568,536 H 648 Q 656,536 656,528 V 300 Q 656,292 664,292 H 680" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tb-arrow-soft)"/>
      <rect x="664" y="392" width="150" height="15" rx="2" fill="#f5f5f5"/>
      <text class="label" x="668" y="404">合入策略（delivery skill）</text>

      <!-- HOST nodes -->
      <rect x="64" y="104" width="180" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text class="name" x="154" y="130" text-anchor="middle">宿主环境</text>
      <text class="sub" x="154" y="146" text-anchor="middle">GITHUB_TOKEN</text>

      <rect x="260" y="104" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="350" y="128" text-anchor="middle">Tracker 适配器</text>
      <text class="sub-zh" x="350" y="148" text-anchor="middle">在宿主侧读取 token</text>

      <rect x="64" y="196" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="184" y="222" text-anchor="middle">生效运行时</text>
      <text class="sub" x="184" y="240" text-anchor="middle">excludeEnvNames · policy</text>

      <rect x="320" y="196" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="390" y="222" text-anchor="middle">宿主 git / gh</text>
      <text class="sub-zh" x="390" y="240" text-anchor="middle">宿主凭据</text>

      <!-- WORKSPACE nodes -->
      <rect x="64" y="384" width="552" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="340" y="410" text-anchor="middle">工作区</text>
      <text class="sub-zh" x="340" y="428" text-anchor="middle">克隆仓库 · 确定性分支 · 宿主所有</text>

      <rect x="112" y="496" width="456" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="340" y="522" text-anchor="middle">Codex app-server</text>
      <text class="sub-zh" x="340" y="540" text-anchor="middle">coding agent 子进程 · cwd = workspace</text>
      <text class="sub-zh" x="340" y="566" text-anchor="middle">子进程环境排除 GITHUB_TOKEN（excludeEnvNames）</text>

      <!-- GITHUB node (external) -->
      <rect x="680" y="120" width="240" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="800" y="156" text-anchor="middle">GitHub</text>
      <text class="sub" x="800" y="176" text-anchor="middle">REST API · git remote</text>
      <text class="sub-zh" x="800" y="194" text-anchor="middle">持久事实 · issue · PR · CI</text>

      <!-- AUTO-MERGE GATE node (focal) -->
      <rect x="680" y="260" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="name" x="800" y="286" text-anchor="middle">自动合入门</text>
      <text class="sub" x="800" y="302" text-anchor="middle">opt-in · PR ownership</text>
      <text class="sub" x="800" y="316" text-anchor="middle">required + observed green</text>

      <!-- Footer notes -->
      <line x1="40" y1="608" x2="920" y2="608" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="foot-accent" x="40" y="630">MVP 信任边界——临时且非最终；未来可能由 provider-native tools 边界替代。</text>
      <text class="foot" x="40" y="648">tracker 在宿主侧读取 GITHUB_TOKEN；agent 子进程不会继承它。</text>
      <text class="foot" x="40" y="666">排除 token 不等于沙箱——delivery skill 仍使用宿主 git/gh 凭据。</text>
      <text class="foot" x="40" y="684">自动合入门只作用于 delivery skill 的 squash-merge 决策；push、创建/复用 PR 与读取 checks 不受该门限制。</text>
      <text class="foot" x="40" y="702">自动合入需要 opt-in 与 PR ownership，且 required / observed checks 全绿；pending、failed、zero、unknown 一律不合入。</text>
    </svg>
