<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="runtime-architecture-title runtime-architecture-desc" id="runtime-architecture-root">
      <title id="runtime-architecture-title">Symphony runtime architecture</title>
      <desc id="runtime-architecture-desc">The Orchestrator is the runtime hub: it loads typed config from WORKFLOW.md, pulls normalized issues from the GitHub-backed tracker adapter, provisions workspaces, runs Codex app-server attempts, and projects a read-only observability snapshot.</desc>

      <defs>
        <style>
          #runtime-architecture-root .name { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #2d3142; }
          #runtime-architecture-root .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
          #runtime-architecture-root .zone-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; fill: rgba(45,49,66,0.40); }
          #runtime-architecture-root .arrow-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
          #runtime-architecture-root .legend { font-family: 'Geist', system-ui, sans-serif; font-size: 8.5px; fill: #4f5d75; }
          #runtime-architecture-root .legend-key { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.18em; fill: #4f5d75; }
        </style>
        <marker id="ra-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="ra-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="ra-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="24" y="200" width="232" height="192" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="96" y="204" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="140" y="213" text-anchor="middle">CONFIG INPUTS</text>

      <rect x="304" y="64" width="352" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="440" y="68" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="480" y="77" text-anchor="middle">COORDINATION</text>

      <rect x="692" y="64" width="228" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="766" y="68" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="806" y="77" text-anchor="middle">EXECUTION</text>

      <!-- Arrows (drawn before nodes) -->
      <line x1="140" y1="280" x2="140" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="232" y1="332" x2="340" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="232" y1="128" x2="340" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ra-arrow-link)"/>

      <line x1="490" y1="160" x2="490" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <path d="M 640,272 H 664 Q 672,272 672,264 V 136 Q 672,128 680,128 H 708" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <path d="M 640,304 H 680 Q 688,304 688,296 V 240 Q 688,232 696,232 H 708" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="802" y1="160" x2="802" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="802" y1="264" x2="802" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/>

      <line x1="490" y1="360" x2="490" y2="456" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ra-arrow-accent)"/>

      <!-- Arrow labels -->
      <text class="arrow-label" x="286" y="326" text-anchor="middle">typed config</text>

      <rect x="496" y="194" width="86" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="500" y="203">normalized Issue</text>

      <rect x="612" y="190" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="616" y="199">dispatch</text>

      <rect x="644" y="296" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="667" y="305" text-anchor="middle">attempt</text>

      <rect x="810" y="170" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="814" y="179">workspace</text>

      <rect x="810" y="278" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="814" y="287">session</text>

      <rect x="498" y="398" width="122" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="502" y="407" fill="#eb6c36">read-only snapshot</text>

      <!-- Node: GitHub (external) -->
      <rect x="48" y="96" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="140" y="124" text-anchor="middle">GitHub</text>
      <text class="sub" x="140" y="140" text-anchor="middle">issues · PRs · CI facts</text>

      <!-- Node: WORKFLOW.md (input) -->
      <rect x="48" y="232" width="184" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text class="name" x="140" y="254" text-anchor="middle">WORKFLOW.md</text>
      <text class="sub" x="140" y="269" text-anchor="middle">front matter + prompt</text>

      <!-- Node: Config / Workflow Loader -->
      <rect x="48" y="304" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="140" y="329" text-anchor="middle">Config / Workflow Loader</text>
      <text class="sub" x="140" y="345" text-anchor="middle">parse · validate · reload</text>

      <!-- Node: Issue Tracker Adapter -->
      <rect x="340" y="96" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="490" y="124" text-anchor="middle">Issue Tracker Adapter</text>
      <text class="sub" x="490" y="140" text-anchor="middle">provider-agnostic · normalizes payloads</text>

      <!-- Node: Orchestrator (focal) -->
      <rect x="340" y="248" width="300" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="name" x="490" y="298" text-anchor="middle">Orchestrator</text>
      <text class="sub" x="490" y="316" text-anchor="middle">scheduler · supervisor · reconciler</text>
      <text class="sub" x="490" y="332" text-anchor="middle">single runtime authority</text>

      <!-- Node: Workspace Manager -->
      <rect x="708" y="96" width="188" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="802" y="124" text-anchor="middle">Workspace Manager</text>
      <text class="sub" x="802" y="140" text-anchor="middle">isolated dir · hooks</text>

      <!-- Node: Agent Runner -->
      <rect x="708" y="200" width="188" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="802" y="228" text-anchor="middle">Agent Runner</text>
      <text class="sub" x="802" y="244" text-anchor="middle">prompt · session events</text>

      <!-- Node: Codex app-server (external subprocess) -->
      <rect x="708" y="312" width="188" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="name" x="802" y="340" text-anchor="middle">Codex app-server</text>
      <text class="sub" x="802" y="356" text-anchor="middle">coding agent subprocess</text>

      <!-- Node: Observability (read-only) -->
      <rect x="340" y="456" width="300" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text class="name" x="490" y="480" text-anchor="middle">Observability</text>
      <text class="sub" x="490" y="496" text-anchor="middle">logs · read-only status snapshot</text>

      <!-- Legend -->
      <line x1="48" y1="548" x2="912" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text class="legend-key" x="48" y="562">LEGEND</text>

      <rect x="48" y="576" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text class="legend" x="68" y="584">Scheduler hub</text>

      <rect x="188" y="576" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="legend" x="208" y="584">Runtime component</text>

      <rect x="348" y="576" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text class="legend" x="368" y="584">External</text>

      <line x1="456" y1="583" x2="484" y2="583" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ra-arrow-accent)"/>
      <text class="legend" x="492" y="584">Read-only consumption</text>
    </svg>
